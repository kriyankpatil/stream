server {
    listen 80;
    server_name _;

    # Increase client max body size for large video files
    client_max_body_size 0;

    # Serve static frontend
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes fallback to index.html if needed
    location / {
        try_files $uri /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API and streaming endpoints to backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /hls/ {
        # Increase buffering for HLS segments
        proxy_buffering on;
        proxy_buffers 16 512k;
        proxy_busy_buffers_size 512k;

        proxy_pass http://backend:3000/hls/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HLS specific headers and caching
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800";
        
        # Longer timeouts for HLS
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        types {
            application/vnd.apple.mpegurl m3u8;
            video/MP2T ts;
        }
    }

    location /video {
        proxy_pass http://backend:3000/video;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Video streaming timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


