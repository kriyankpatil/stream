
server {
    listen 80;
    server_name _;

    # Increase client max body size for large video files
    client_max_body_size 0;

    # Serve static frontend
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes fallback to index.html if needed
    location / {
        try_files $uri /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API endpoints to backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Add error handling
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }


    # Proxy video streaming endpoints for all movies
    location /video/ {
        proxy_pass http://backend:3000/video/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Video streaming timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for real-time streaming
        proxy_buffering off;
        
        # Add error handling
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Backend down handler
    location @backend_down {
        return 503 "Backend service is currently unavailable. Please try again later.";
        add_header Content-Type text/plain;
    }
}


