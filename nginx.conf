server {
    listen 80;
    server_name _;

    # Serve static frontend
    root /usr/share/nginx/html;
    index index.html;

    # Frontend routes fallback to index.html if needed
    location / {
        try_files $uri /index.html;
    }

    # Proxy API and streaming endpoints to backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hls/ {
        # Increase buffering for HLS segments
        proxy_buffering on;
        proxy_buffers 16 512k;
        proxy_busy_buffers_size 512k;

        proxy_pass http://backend:3000/hls/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HLS specific headers
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800";
        types {
            application/vnd.apple.mpegurl m3u8;
            video/MP2T ts;
        }
    }

    location /video {
        proxy_pass http://backend:3000/video;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


