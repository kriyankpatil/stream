services:
  backend:
    build: .
    container_name: stream-backend
    environment:
      - HOST=0.0.0.0
      - ACCESS_TOKEN=${ACCESS_TOKEN:-kriyank2024}
      - NODE_ENV=production
      # Uncomment to force a rebuild of HLS on next start
      # - FORCE_HLS=1
    volumes:
      - ./movies:/app/movies
      - ./public:/app/public
    networks:
      - app
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    image: nginx:stable-alpine
    container_name: stream-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    restart: unless-stopped

  tunnel:
    image: node:20-alpine
    container_name: stream-tunnel
    depends_on:
      - frontend
    working_dir: /app
    command: >
      sh -c "
        npm install -g localtunnel &&
        npx localtunnel --port 8080 --subdomain mymovies
      "
    network_mode: host
    restart: unless-stopped

volumes:
  hls_data:

networks:
  app:
    driver: bridge


