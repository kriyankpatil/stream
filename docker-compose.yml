version: "3.9"

services:
  backend:
    build: .
    container_name: stream-backend
    environment:
      - HOST=0.0.0.0
      - ACCESS_TOKEN=${ACCESS_TOKEN:-kriya2024}
      # Uncomment to force a rebuild of HLS on next start
      # - FORCE_HLS=1
    volumes:
      - ./movie:/app/movie:ro
      - hls_data:/app/hls
    networks:
      - app
    expose:
      - "3000"

  frontend:
    image: nginx:stable-alpine
    container_name: stream-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stream-cloudflared
    depends_on:
      - frontend
    # Create a Named Tunnel in Cloudflare and set CLOUDFLARE_TUNNEL_TOKEN in .env
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - app

volumes:
  hls_data:

networks:
  app:
    driver: bridge


